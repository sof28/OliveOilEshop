<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-brand">
      <span class="brand-icon">??</span>
      <span class="brand-name">ModularCommerce</span>
    </a>
    <div class="navbar-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/products" routerLinkActive="active">Shop</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/cart" class="cart-link" routerLinkActive="active">
        <span class="cart-icon">??</span>
        @if ((cartService.itemCount$ | async) ?? 0; as count) {
          @if (count > 0) {
            <span class="cart-badge">{{ count }}</span>
          }
        }
      </a>
      @if (authService.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active" class="admin-link">?? Admin</a>
      }
      @if (authService.isLoggedIn()) {
        <button class="btn-logout" (click)="logout()">Sign Out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="login-link">Sign In</a>
      }
    </div>
  </div>
</nav>
