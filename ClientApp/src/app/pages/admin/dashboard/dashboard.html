<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span>🫒</span>
      <span>Admin Panel</span>
    </div>
    <nav class="admin-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>📊</span> Dashboard
      </a>
      <a routerLink="/admin/products" routerLinkActive="active">
        <span>🫒</span> Products
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active">
        <span>📦</span> Orders
      </a>
    </nav>
    <a routerLink="/" class="admin-nav-back">← Back to Shop</a>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Welcome, {{ authService.getCurrentUser()?.username }}</h1>
      <p>Manage your store from here.</p>
    </div>

    <div class="admin-cards">
      <a routerLink="/admin/products" class="admin-card">
        <span class="card-icon">🫒</span>
        <span class="card-label">Manage Products</span>
        <span class="card-desc">Add, edit or remove products</span>
      </a>
      <a routerLink="/admin/orders" class="admin-card">
        <span class="card-icon">📦</span>
        <span class="card-label">Manage Orders</span>
        <span class="card-desc">View and update order statuses</span>
      </a>
    </div>
  </main>
</div>
